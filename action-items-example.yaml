# Action Items Example Configuration
# This demonstrates various ways to use action-only UI elements

esphome:
  name: nspanel-actions
  name_add_mac_suffix: true
  comment: "NSPanel with Action-Only Elements Examples"
  build_path: ./.build/nspanel-actions

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [nspanel_lovelace]

# Example internal buttons that aren't exposed to Home Assistant
button:
  - platform: template
    id: cover_wz_open
    name: "Cover WZ Open"
    internal: true
    on_press:
      - logger.log: "Opening cover via internal button"
      
  - platform: template
    id: cover_wz_stop
    name: "Cover WZ Stop"
    internal: true
    on_press:
      - logger.log: "Stopping cover via internal button"
      
  - platform: template
    id: cover_wz_close
    name: "Cover WZ Close"
    internal: true
    on_press:
      - logger.log: "Closing cover via internal button"

# Example script for more complex actions
script:
  - id: night_mode_script
    then:
      - logger.log: "Activating night mode"
      - delay: 1s
      - logger.log: "Night mode activated"

nspanel_lovelace:
  id: nspanel
  screensaver:
    time_id: homeassistant_time
  cards:
    # Example 1: Home Assistant Service Calls
    - type: cardGrid
      id: ha_services
      title: Services
      entities:
        # Call vacuum service
        - type: action
          icon: robot-vacuum
          name: Start Vacuum
          on_press:
            - homeassistant.service:
                service: vacuum.start
                data:
                  entity_id: vacuum.mi_robot
        
        # Call cover service with area target
        - type: action
          id: open_all_covers
          icon: chevron-double-up
          name: Open All
          on_press:
            - homeassistant.action:
                action: cover.open_cover
                data:
                  target:
                    area_id: living_room_area_id
        
        # Call scene
        - type: action
          icon: movie
          name: Movie Time
          on_press:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.movie_mode
        
        # Mix with regular entity
        - entity_id: light.living_room
          name: Light

    # Example 2: Internal ESPHome Buttons (like from issue #54)
    - type: cardGrid
      id: cover_controls
      title: Rollo WZ
      entities:
        - type: action
          id: cover_open_action
          icon: chevron-double-up
          name: Auf
          on_press:
            - button.press: cover_wz_open
            
        - type: action
          id: cover_stop_action
          icon: stop
          name: Stop
          on_press:
            - button.press: cover_wz_stop
            
        - type: action
          id: cover_close_action
          icon: chevron-double-down
          name: Zu
          on_press:
            - button.press: cover_wz_close
        
        # Empty slot for visual balance
        - entity_id: delete

    # Example 3: ESPHome Scripts and Multiple Actions
    - type: cardGrid
      id: scenes_and_scripts
      title: Scenes
      entities:
        # Execute ESPHome script
        - type: action
          icon: script-text
          name: Run Script
          on_press:
            - script.execute: night_mode_script
        
        # Multiple actions in sequence
        - type: action
          icon: power
          name: Good Night
          on_press:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.living_room
            - homeassistant.service:
                service: cover.close_cover
                data:
                  entity_id: cover.bedroom
            - logger.log: "Good night sequence complete"
        
        # Simple logging action for testing
        - type: action
          icon: gesture-tap-button
          name: Test Log
          on_press:
            - logger.log: "Test button pressed from NSPanel!"

    # Example 4: Mixing Entity and Action Types
    - type: cardEntities
      id: mixed_entities
      title: Mixed Controls
      entities:
        # Regular entity with state display
        - entity_id: sensor.temperature
          name: Temperature
        
        # Action button that doesn't need entity state
        - type: action
          icon: refresh
          name: Refresh
          on_press:
            - homeassistant.service:
                service: homeassistant.update_entity
                data:
                  entity_id: sensor.temperature

logger:
  baud_rate: 115200
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  platform: esphome

uart:
  id: uart_nextion
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/London
